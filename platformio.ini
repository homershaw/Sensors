[platformio]
default_envs = esp32_mos_x4

[env:esp32_mos_x4]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
  knolleary/PubSubClient@^2.8
